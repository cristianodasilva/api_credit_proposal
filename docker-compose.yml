services:
  postgres:
    image: postgres:17
    container_name: credit_proposals_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit_proposals
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d credit_proposals"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API containerizada. Sobe apenas com: docker compose --profile app up -d --build
  api:
    build: .
    container_name: credit_proposals_api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/credit_proposals?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 3333
    ports:
      - "3333:3333"

volumes:
  postgres_data:
